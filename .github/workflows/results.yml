name: Update official NHL results
on:
  workflow_dispatch:
  push:
    paths: ['data.json', 'game-meta.json', 'scripts/update_results.py', '.github/workflows/results.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: official-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/update_results.py
      - name: Commit official results
        run: |
          git config user.name 'Magpie results bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results.json results-status.json
          git diff --cached --quiet || git commit -m 'Refresh official NHL game outcomes'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
